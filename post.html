<!DOCTYPE html>
<html lang="ja">
<head>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1114439957744970" crossorigin="anonymous"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PromptStash — 投稿</title>
<meta name="description" content="あなたのAIプロンプトをPromptStashに投稿して、みんなと共有しましょう。">
<link rel="canonical" href="https://promptstash-jp.vercel.app/post.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #14151c;
    --surface: #1c1e29;
    --surface-2: #23273a;
    --border: #33374a;
    --text: #eceaf4;
    --text-muted: #9497ac;
    --mint: #6fe7c0;
    --amber: #f2a65a;
    --violet: #8b85f0;
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ink);
    color: var(--text);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 56px 24px 100px;
  }
  .eyebrow {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--amber);
    letter-spacing: 0.08em;
    margin-bottom: 12px;
  }
  h1 {
    font-family: var(--font-display);
    font-size: 32px;
    font-weight: 700;
    margin: 0 0 8px;
  }
  .sub { color: var(--text-muted); font-size: 14px; margin: 0 0 20px; }
  .back-link {
    display: inline-block;
    margin-bottom: 20px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--mint);
    text-decoration: none;
  }

  label {
    display: block;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 6px;
    margin-top: 20px;
  }
  input[type="text"], input[type="email"], input[type="password"], input[type="number"], select, textarea {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 14px;
  }
  textarea {
    font-family: var(--font-mono);
    font-size: 13px;
    min-height: 140px;
    resize: vertical;
    line-height: 1.6;
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--mint);
  }

  .btn {
    margin-top: 28px;
    width: 100%;
    padding: 13px;
    border-radius: 8px;
    border: none;
    background: var(--mint);
    color: var(--ink);
    font-family: var(--font-mono);
    font-weight: 500;
    font-size: 14px;
    cursor: pointer;
  }
  .btn:hover { opacity: 0.9; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn.secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    margin-top: 12px;
  }

  .msg {
    margin-top: 16px;
    font-family: var(--font-mono);
    font-size: 13px;
    padding: 10px 14px;
    border-radius: 8px;
    display: none;
  }
  .msg.ok { background: rgba(111,231,192,0.1); color: var(--mint); display: block; }
  .msg.err { background: rgba(242,166,90,0.1); color: var(--amber); display: block; }

  .auth-box {
    max-width: 360px;
    margin: 100px auto;
    padding: 0 24px;
  }
  .auth-box h2 {
    font-family: var(--font-display);
    font-size: 22px;
    margin-bottom: 4px;
  }
  .auth-box .sub { margin-bottom: 24px; }

  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 9px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    font-family: var(--font-mono);
    font-size: 13px;
    cursor: pointer;
  }
  .tab.active { border-color: var(--mint); color: var(--mint); }

  .userbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .userbar span {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-muted);
  }
  .logout-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    font-family: var(--font-mono);
    font-size: 12px;
    cursor: pointer;
    text-decoration: underline;
  }

  #authScreen { display: none; }
  #app { display: none; }
</style>
</head>
<body>

<div class="auth-box" id="authScreen">
  <div class="tabs">
    <div class="tab active" id="tabLogin" onclick="switchTab('login')">ログイン</div>
    <div class="tab" id="tabSignup" onclick="switchTab('signup')">新規登録</div>
  </div>
  <h2 id="authTitle">ログイン</h2>
  <p class="sub" id="authSub">アカウントでログインして投稿しましょう。</p>

  <label>メールアドレス</label>
  <input type="email" id="authEmail" placeholder="you@example.com" />

  <label>パスワード</label>
  <input type="password" id="authPassword" placeholder="6文字以上" />

  <button class="btn" id="authSubmitBtn" onclick="submitAuth()">ログイン</button>
  <div style="text-align: right; margin-top: 10px;">
    <a href="#" id="forgotLink" onclick="showForgot(event)" style="font-family: var(--font-mono); font-size: 12px; color: var(--text-muted); text-decoration: underline;">パスワードをお忘れですか？</a>
  </div>
  <div class="msg" id="authMsg"></div>

  <div id="forgotBox" style="display:none; margin-top: 24px; padding-top: 24px; border-top: 1px solid var(--border);">
    <p class="sub" style="margin-bottom: 12px;">登録済みのメールアドレスに、パスワード再設定用のリンクを送ります。</p>
    <input type="email" id="forgotEmail" placeholder="you@example.com" />
    <button class="btn secondary" onclick="sendResetEmail()">送信する</button>
    <div class="msg" id="forgotMsg"></div>
  </div>
</div>

<div id="app">
  <nav style="border-bottom: 1px solid var(--border); padding: 16px 24px;">
    <div style="max-width: 640px; margin: 0 auto; display:flex; justify-content:space-between; align-items:center;">
      <a href="index.html" style="font-family: var(--font-display); font-weight:700; font-size:16px; color:var(--text); text-decoration:none;">PromptStash</a>
      <div style="display:flex; gap:18px; align-items:center;">
        <a href="post.html" style="font-family: var(--font-mono); font-size:12px; color:var(--mint); text-decoration:none;">投稿する</a>
        <a href="account.html" style="font-family: var(--font-mono); font-size:12px; color:var(--text-muted); text-decoration:none;">マイページ</a>
        <button class="logout-btn" onclick="logout()">ログアウト</button>
      </div>
    </div>
  </nav>
  <div class="wrap">
    <div class="eyebrow">新規プロンプト投稿</div>
    <h1 id="formTitle">プロンプトを追加</h1>
    <p class="sub">ここで投稿した内容は、すぐにトップページの一覧に反映されます。</p>

    <label>カテゴリ</label>
    <select id="category">
      <option value="text">テキスト生成</option>
      <option value="image">画像生成</option>
      <option value="code">コーディング</option>
      <option value="video">動画・音声</option>
    </select>

    <label>タイトル</label>
    <input type="text" id="title" placeholder="例：SNS投稿の反応が良くなるフック文3案" />

    <label>プロンプト本文（変数は {変数名} の形で）</label>
    <textarea id="body" placeholder="例：{テーマ}についてのSNS投稿を作ります。最初の1文（フック）を..."></textarea>

    <button class="btn" id="submitBtn" onclick="submitPrompt()">投稿する</button>
    <button class="btn secondary" id="cancelEditBtn" onclick="cancelEdit()" style="display:none;">編集をキャンセル</button>
    <div class="msg" id="resultMsg"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function () {
  const SUPABASE_URL = 'https://yoblldcldamfgokhghzg.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlvYmxsZGNsZGFtZmdva2hnaHpnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0NDY2OTYsImV4cCI6MjEwMjAyMjY5Nn0.wxeJ9G9NG6YqlwdnVZtXz4pj0hwDxTU6C5syZ9XojQ0';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const categoryLabels = {
    text: 'テキスト生成',
    image: '画像生成',
    code: 'コーディング',
    video: '動画・音声',
  };

  let mode = 'login'; // 'login' or 'signup'
  let currentUser = null;
  let editingId = null; // 編集中のプロンプトID（nullなら新規投稿モード）

  window.switchTab = function (m) {
    mode = m;
    document.getElementById('tabLogin').classList.toggle('active', m === 'login');
    document.getElementById('tabSignup').classList.toggle('active', m === 'signup');
    document.getElementById('authTitle').textContent = m === 'login' ? 'ログイン' : '新規登録';
    document.getElementById('authSub').textContent = m === 'login'
      ? 'アカウントでログインして投稿しましょう。'
      : '新しいアカウントを作成します。';
    document.getElementById('authSubmitBtn').textContent = m === 'login' ? 'ログイン' : '登録する';
    document.getElementById('authMsg').style.display = 'none';
    document.getElementById('forgotBox').style.display = 'none';
    document.getElementById('forgotLink').style.display = m === 'login' ? 'inline' : 'none';
  };

  window.showForgot = function (e) {
    e.preventDefault();
    document.getElementById('forgotBox').style.display = 'block';
  };

  window.sendResetEmail = async function () {
    const email = document.getElementById('forgotEmail').value.trim();
    const msg = document.getElementById('forgotMsg');

    if (!email) {
      msg.className = 'msg err';
      msg.textContent = 'メールアドレスを入力してください。';
      return;
    }

    const redirectTo = window.location.origin + '/reset-password.html';
    const { error } = await supabaseClient.auth.resetPasswordForEmail(email, { redirectTo });

    if (error) {
      msg.className = 'msg err';
      msg.textContent = error.message;
      return;
    }

    msg.className = 'msg ok';
    msg.textContent = 'メールを送信しました。届いたリンクからパスワードを再設定してください。';
  };

  window.submitAuth = async function () {
    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value;
    const msg = document.getElementById('authMsg');
    const btn = document.getElementById('authSubmitBtn');

    if (!email || !password) {
      msg.className = 'msg err';
      msg.textContent = 'メールアドレスとパスワードを入力してください。';
      return;
    }

    btn.disabled = true;

    let result;
    if (mode === 'login') {
      result = await supabaseClient.auth.signInWithPassword({ email, password });
    } else {
      result = await supabaseClient.auth.signUp({ email, password });
    }

    btn.disabled = false;

    if (result.error) {
      msg.className = 'msg err';
      msg.textContent = result.error.message;
      return;
    }

    if (mode === 'signup' && !result.data.session) {
      msg.className = 'msg ok';
      msg.textContent = '登録しました。確認メールを送りましたので確認してください。';
      return;
    }

    showApp(result.data.session);
  };

  window.logout = async function () {
    await supabaseClient.auth.signOut();
    document.getElementById('app').style.display = 'none';
    document.getElementById('authScreen').style.display = 'block';
  };

  function showApp(session) {
    currentUser = session.user;
    document.getElementById('authScreen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    loadEditTargetIfAny();
  }

  window.submitPrompt = async function () {
    const category = document.getElementById('category').value;
    const title = document.getElementById('title').value.trim();
    const body = document.getElementById('body').value.trim();
    const msg = document.getElementById('resultMsg');
    const btn = document.getElementById('submitBtn');

    if (!title || !body) {
      msg.className = 'msg err';
      msg.textContent = 'タイトルと本文を入力してください。';
      return;
    }

    btn.disabled = true;
    btn.textContent = editingId ? '更新中...' : '投稿中...';

    let error;
    if (editingId) {
      const result = await supabaseClient
        .from('prompts')
        .update({
          category: category,
          tag_label: categoryLabels[category],
          title: title,
          body: body,
        })
        .eq('id', editingId);
      error = result.error;
    } else {
      const result = await supabaseClient.from('prompts').insert({
        category: category,
        tag_label: categoryLabels[category],
        title: title,
        body: body,
        likes: 0,
        user_id: currentUser.id,
      });
      error = result.error;
    }

    btn.disabled = false;
    btn.textContent = editingId ? '更新する' : '投稿する';

    if (error) {
      msg.className = 'msg err';
      msg.textContent = (editingId ? '更新' : '投稿') + 'に失敗しました: ' + error.message;
      return;
    }

    msg.className = 'msg ok';
    msg.textContent = editingId ? '更新しました！マイページで確認できます。' : '投稿しました！トップページで確認してください。';

    if (editingId) {
      setTimeout(() => { window.location.href = 'account.html'; }, 900);
    } else {
      document.getElementById('title').value = '';
      document.getElementById('body').value = '';
    }
  };

  window.cancelEdit = function () {
    window.location.href = 'account.html';
  };

  async function loadEditTargetIfAny() {
    const params = new URLSearchParams(window.location.search);
    const editId = params.get('edit');
    if (!editId) return;

    const { data, error } = await supabaseClient
      .from('prompts')
      .select('*')
      .eq('id', editId)
      .eq('user_id', currentUser.id)
      .single();

    if (error || !data) {
      alert('編集対象のプロンプトが見つかりませんでした（他の人の投稿は編集できません）。');
      return;
    }

    editingId = data.id;
    document.getElementById('category').value = data.category;
    document.getElementById('title').value = data.title;
    document.getElementById('body').value = data.body;
    document.getElementById('submitBtn').textContent = '更新する';
    document.getElementById('formTitle').textContent = 'プロンプトを編集';
    document.getElementById('cancelEditBtn').style.display = 'block';
  }

  // 起動時にログイン状態を確認
  (async function init() {
    const { data } = await supabaseClient.auth.getSession();
    if (data.session) {
      showApp(data.session);
    } else {
      document.getElementById('authScreen').style.display = 'block';
    }
  })();
})();
</script>

</body>
</html>
