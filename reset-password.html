<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PromptStash — パスワード再設定</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #14151c;
    --surface: #1c1e29;
    --border: #33374a;
    --text: #eceaf4;
    --text-muted: #9497ac;
    --mint: #6fe7c0;
    --amber: #f2a65a;
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ink);
    color: var(--text);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  .box {
    max-width: 360px;
    margin: 120px auto;
    padding: 0 24px;
  }
  h2 {
    font-family: var(--font-display);
    font-size: 22px;
    margin-bottom: 4px;
  }
  .sub { color: var(--text-muted); font-size: 14px; margin: 0 0 24px; }
  label {
    display: block;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 6px;
    margin-top: 20px;
  }
  input[type="password"] {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 14px;
  }
  input:focus { outline: none; border-color: var(--mint); }
  .btn {
    margin-top: 28px;
    width: 100%;
    padding: 13px;
    border-radius: 8px;
    border: none;
    background: var(--mint);
    color: var(--ink);
    font-family: var(--font-mono);
    font-weight: 500;
    font-size: 14px;
    cursor: pointer;
  }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .msg {
    margin-top: 16px;
    font-family: var(--font-mono);
    font-size: 13px;
    padding: 10px 14px;
    border-radius: 8px;
    display: none;
  }
  .msg.ok { background: rgba(111,231,192,0.1); color: var(--mint); display: block; }
  .msg.err { background: rgba(242,166,90,0.1); color: var(--amber); display: block; }
  a.back { display: inline-block; margin-top: 20px; font-family: var(--font-mono); font-size: 12px; color: var(--mint); text-decoration: none; }
</style>
</head>
<body>

<div class="box">
  <h2 id="title">確認中...</h2>
  <p class="sub" id="sub">リンクを確認しています。少々お待ちください。</p>

  <div id="formArea" style="display:none;">
    <label>新しいパスワード</label>
    <input type="password" id="newPassword" placeholder="6文字以上" />
    <button class="btn" id="submitBtn" onclick="updatePassword()">パスワードを更新する</button>
  </div>

  <div class="msg" id="msg"></div>
  <a class="back" href="post.html" id="backLink" style="display:none;">投稿ページへ移動する →</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function () {
  const SUPABASE_URL = 'https://yoblldcldamfgokhghzg.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlvYmxsZGNsZGFtZmdva2hnaHpnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0NDY2OTYsImV4cCI6MjEwMjAyMjY5Nn0.wxeJ9G9NG6YqlwdnVZtXz4pj0hwDxTU6C5syZ9XojQ0';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  window.updatePassword = async function () {
    const newPassword = document.getElementById('newPassword').value;
    const msg = document.getElementById('msg');
    const btn = document.getElementById('submitBtn');

    if (!newPassword || newPassword.length < 6) {
      msg.className = 'msg err';
      msg.textContent = '6文字以上のパスワードを入力してください。';
      return;
    }

    btn.disabled = true;
    btn.textContent = '更新中...';

    const { error } = await supabaseClient.auth.updateUser({ password: newPassword });

    btn.disabled = false;
    btn.textContent = 'パスワードを更新する';

    if (error) {
      msg.className = 'msg err';
      msg.textContent = error.message;
      return;
    }

    msg.className = 'msg ok';
    msg.textContent = 'パスワードを更新しました。';
    document.getElementById('formArea').style.display = 'none';
    document.getElementById('backLink').style.display = 'inline-block';
  };

  // メール内リンクからアクセスされたときにセッションが確立されるのを待つ
  supabaseClient.auth.onAuthStateChange((event, session) => {
    if (event === 'PASSWORD_RECOVERY') {
      document.getElementById('title').textContent = '新しいパスワードを設定';
      document.getElementById('sub').textContent = '新しいパスワードを入力してください。';
      document.getElementById('formArea').style.display = 'block';
    }
  });

  // 数秒待ってもリカバリーイベントが来ない場合のフォールバック確認
  setTimeout(async () => {
    const { data } = await supabaseClient.auth.getSession();
    const formShown = document.getElementById('formArea').style.display === 'block';
    if (!data.session && !formShown) {
      document.getElementById('title').textContent = 'リンクが無効です';
      document.getElementById('sub').textContent = 'このリンクは無効か、期限切れの可能性があります。もう一度パスワード再設定をお試しください。';
    }
  }, 2500);
})();
</script>

</body>
</html>
