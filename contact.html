<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>お問い合わせ — PromptStash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #14151c;
    --surface: #1c1e29;
    --border: #33374a;
    --text: #eceaf4;
    --text-muted: #9497ac;
    --mint: #6fe7c0;
    --amber: #f2a65a;
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ink);
    color: var(--text);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 56px 24px 100px; }
  a.back {
    display: inline-block; margin-bottom: 24px;
    font-family: var(--font-mono); font-size: 12px; color: var(--mint); text-decoration: none;
  }
  h1 { font-family: var(--font-display); font-size: 28px; margin-bottom: 8px; }
  .sub { color: var(--text-muted); font-size: 14px; margin-bottom: 36px; }
  label {
    display: block; font-family: var(--font-mono); font-size: 12px;
    color: var(--text-muted); margin-bottom: 6px; margin-top: 20px;
  }
  input[type="text"], input[type="email"], textarea {
    width: 100%; background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px 14px; color: var(--text);
    font-family: var(--font-body); font-size: 14px;
  }
  textarea { min-height: 140px; resize: vertical; line-height: 1.6; }
  input:focus, textarea:focus { outline: none; border-color: var(--mint); }
  button {
    margin-top: 28px; width: 100%; padding: 13px; border-radius: 8px; border: none;
    background: var(--mint); color: var(--ink); font-family: var(--font-mono);
    font-weight: 500; font-size: 14px; cursor: pointer;
  }
  button:hover { opacity: 0.9; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← トップページへ戻る</a>
  <h1>お問い合わせ</h1>
  <p class="sub">ご意見・ご要望・不具合の報告などがあれば、以下のフォームからお気軽にご連絡ください。</p>

  <form action="https://formspree.io/f/mrpzkvjv" method="POST">
    <label>お名前</label>
    <input type="text" name="name" required />

    <label>メールアドレス</label>
    <input type="email" name="email" required />

    <label>お問い合わせ内容</label>
    <textarea name="message" required></textarea>

    <button type="submit">送信する</button>
  </form>
</div>
</body>
</html>
